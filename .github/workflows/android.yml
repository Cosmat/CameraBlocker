name: Build Android APK - Full Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show project structure
        run: |
          echo "=== Root build.gradle.kts ==="
          cat build.gradle.kts
          echo ""
          echo "=== App build.gradle.kts ==="
          cat app/build.gradle.kts
          echo ""
          echo "=== Settings ==="
          cat settings.gradle.kts

      - name: List all Gradle tasks
        run: ./gradlew tasks --all --no-daemon

      - name: Check Android plugin is applied
        run: ./gradlew app:properties --no-daemon | grep -E "(android|applicationId|compileSdk)" || true

      - name: Build Debug APK (FAIL ON ERROR)
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace --info > build.log 2>&1
          echo "=== BUILD LOG (last 1000 lines) ==="
          tail -1000 build.log

      - name: Show build outputs structure
        run: |
          echo "=== app/build/outputs ==="
          find app/build/outputs -type f 2>/dev/null | head -100
          echo ""
          echo "=== All APKs ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo ""
          echo "=== All AABs ==="
          find . -name "*.aab" -type f 2>/dev/null
          echo ""
          echo "=== app/build/outputs/apk ==="
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "Directory not found"
          echo ""
          echo "=== app/build/outputs/bundle ==="
          ls -la app/build/outputs/bundle/ 2>/dev/null || echo "Directory not found"

      - name: Check if app module exists and has build dir
        run: |
          echo "=== App module dir ==="
          ls -la app/
          echo ""
          echo "=== App build dir ==="
          ls -la app/build/ 2>/dev/null || echo "No build dir"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Find APK (broad search)
        id: find_apk
        run: |
          echo "=== Searching for APK ==="
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found anywhere!"
            find . -name "*.apk" -type f 2>/dev/null || true
            AAB_PATH=$(find . -name "*.aab" -type f 2>/dev/null | head -1)
            if [ -n "$AAB_PATH" ]; then
              echo "Found AAB instead: $AAB_PATH"
              echo "apk_path=$AAB_PATH" >> $GITHUB_OUTPUT
              exit 0
            fi
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7